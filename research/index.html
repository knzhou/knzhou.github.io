<!-- I work on new ways to test fundamental physics, connecting particle theory with precision experiments. Some of my research themes are outlined below; the linked papers give more details.

## Axion dark matter searches

Axion dark matter can drive extremely weak electromagnetic signals. I develop ways to amplify these signals and make new regions of axion parameter space accessible. In the heterodyne approach, axions convert an excited cavity mode into a second mode at a slightly different frequency. This allows low-mass axions to be searched for using high-frequency superconducting cavities. My work spans the original detection proposals, broadband search strategies, and the design and testing of a prototype cavity. I also study polarization haloscopes, which use oscillating nuclear electric dipole moments to probe the axion's coupling to QCD.














<figure class="research-figure research-figure-wide">

<img src="/img/research/heterodyne-prototype.jpg" alt="Three photographs of the heterodyne cavity prototype: its corrugated interior, copper endplates, and an installed tunable endplate." width="1728" height="500" ></a>

    The heterodyne cavity prototype and its endplates. Corrugations shape the modes to enhance the axion signal and suppress noise. From <a href="/talks/HeterodyneAxion.pdf#page=12">Heterodyne Detection of Axion Dark Matter, slide 12</a>.
  </figcaption>


</figure>


Selected papers:

- <a href="/papers/#paper-heterodyne">A Prototype Hybrid Mode Cavity for Heterodyne Axion Detection</a>
- <a href="/papers/#paper-axionfc">Axion Dark Matter Detection by Superconducting Resonant Frequency Conversion</a>

- <a href="/papers/#paper-qcdaxion">Discovering QCD-Coupled Axion Dark Matter with Polarization Haloscopes</a>

## Spin-dependent dark matter

Dark matter could reveal itself through forces and torques on electron spins. I study the resulting signals in materials and how they can guide new experiments, from magnetized multilayers for axion detection to searches for ultralight axial vectors. A useful connection is that neutrons also couple to electron spin: existing neutron scattering measurements can therefore predict the response of a dark matter detector, helping identify promising target materials without relying solely on microscopic calculations.














<figure class="research-figure">


  <a data-fancybox="" href="/img/research/neutron-scattering.png" data-caption="Neutron scattering data from yttrium iron garnet encode the spin response relevant to dark matter searches. From Spin-Dependent Dark Matter Rates from Neutron Scattering, slide 7.">
<img src="/img/research/neutron-scattering.png" alt="A slice of neutron scattering data for yttrium iron garnet, showing the measured response across momentum transfer and arcs sampled at different crystal orientations." width="1014" height="834" ></a>


  
  
  <figcaption>
    Neutron scattering data from yttrium iron garnet encode the spin response relevant to dark matter searches. From <a href="/talks/NeutronScattering.pdf#page=7">Spin-Dependent Dark Matter Rates from Neutron Scattering, slide 7</a>.
  </figcaption>


</figure>


Selected papers:

- <a href="/papers/#paper-axial">Ultralight Axial Dark Matter</a>
- <a href="/papers/#paper-spindependent">Determining Spin-Dependent Light Dark Matter Rates from Neutron Scattering</a>
- <a href="/papers/#paper-axionelectron">Physical Signatures of Fermion-Coupled Axion Dark Matter</a>

## Quantum effects and precision measurements

When do experiments need a quantum description, and when is a classical picture enough? I investigate this question for axion dark matter, gravitational waves, and precision measurements of the electron's magnetic moment. For weakly coupled waves, detector averaging and weak coupling strongly suppress intrinsically quantum signatures. In electron magnetic moment experiments, a quantum calculation of the cavity's effect agrees with the classical result and provides a way to account for additional systematic effects. I also study how rapidly oscillating dark matter fields can produce a steady, second-order response.














<figure class="research-figure">


  <a data-fancybox="" href="/img/research/quantum-suppression.png" data-caption="Two obstacles to observing nonclassical effects: averaging over field modes and the small conversion efficiency of the detector. From Suppressed Quantum Effects of Weakly Coupled Waves, slide 12.">
<img src="/img/research/quantum-suppression.png" alt="Diagram of an axion haloscope showing two obstacles to observing a nonclassical field: coarse graining produces an effectively Gaussian state, while weak coupling compresses nonclassical features." width="844" height="480" ></a>


  
  
  <figcaption>
    Two obstacles to observing nonclassical effects: averaging over field modes and the small conversion efficiency of the detector. From <a href="/talks/Suppression.pdf#page=12">Suppressed Quantum Effects of Weakly Coupled Waves, slide 12</a>.
  </figcaption>


</figure>


Selected papers:

- <a href="/papers/#paper-suppression">Suppressed Quantum Effects of Weakly Coupled Waves</a>
- <a href="/papers/#paper-quantum">Intrinsically Quantum Effects of Axion Dark Matter are Undetectable</a>
- <a href="/papers/#paper-cavityshift">Quantum Calculations of the Cavity Shift in Electron Magnetic Moment Measurements</a>
- <a href="/papers/#paper-ponderomotive">Ponderomotive Effects of Ultralight Dark Matter</a>

## Continuous-spin fields

Relativity and quantum mechanics allow massless particles with a continuous spin scale, a possibility beyond the familiar fixed-helicity photon and graviton. I study how these fields can interact with matter and what their observable consequences would be. Our framework recovers familiar forces at frequencies above the spin scale, while predicting deviations at low frequencies and long distances. These include changes to the Lorentz force and to radiation from an accelerating charge, opening a route to experimental tests of this broader class of theories.














<figure class="research-figure">


  <a data-fancybox="" href="/img/research/continuous-spin-radiation.png" data-caption="Radiation from an oscillating particle coupled to a continuous-spin field. Additional helicities contribute as the spin scale grows, while the total radiated power stays finite. From Electromagnetism and Gravity with Continuous Spin, slide 32.">
<img src="/img/research/continuous-spin-radiation.png" alt="Radiated power versus spin scale times oscillation amplitude. Power shifts from photon-like helicities to additional helicities as the spin scale grows, while the total remains finite." width="1028" height="768" ></a>


  
  
  <figcaption>
    Radiation from an oscillating particle coupled to a continuous-spin field. Additional helicities contribute as the spin scale grows, while the total radiated power stays finite. From <a href="/talks/ContinuousSpin.pdf#page=32">Electromagnetism and Gravity with Continuous Spin, slide 32</a>.
  </figcaption>


</figure>
